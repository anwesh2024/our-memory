name: Build Android App (APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Install Capacitor Dependencies
        run: npm install

      - name: 🤖 Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: 🔐 Inject Camera & Audio Permissions
        run: |
          sed -i 's/<\/manifest>/    <uses-permission android:name="android.permission.CAMERA" \/><uses-permission android:name="android.permission.RECORD_AUDIO" \/><\/manifest>/' android/app/src/main/AndroidManifest.xml

      - name: 🔨 Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Our-Memories-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
