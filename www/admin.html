<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #ec4899; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; padding-bottom: 80px; }
        
        .box { background: var(--card); padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; margin: 20px auto; border: 1px solid rgba(255,255,255,0.05); }
        h2 { margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        input[type="password"], input[type="date"] { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; outline: none; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; width: 100%; }
        
        /* Progress Bar */
        .storage-info { font-size: 0.85rem; color: #94a3b8; margin-top: 5px; }
        .progress-bg { background: #0f172a; border-radius: 10px; width: 100%; height: 10px; margin: 10px 0 20px; overflow: hidden; border: 1px solid #334155; }
        .progress-fill { background: linear-gradient(90deg, #10b981, #3b82f6); height: 100%; width: 0%; transition: width 1s ease; }
        .progress-fill.danger { background: linear-gradient(90deg, #f59e0b, #ef4444); }

        /* Toolbar */
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; background: #0f172a; padding: 10px; border-radius: 10px; }
        .btn-del-bulk { background: #ef4444; color: white; padding: 8px 15px; font-size: 0.85rem; }
        
        /* Video List */
        .file-item { display: flex; gap: 15px; background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 12px; align-items: center; border: 1px solid #334155; transition: 0.2s; }
        .file-item:hover { border-color: var(--accent); }
        .thumb-wrapper { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; background: #000; flex-shrink: 0;}
        .thumb-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .play-icon { position: absolute; top:50%; left:50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.5); padding: 5px; border-radius: 50%; color: white; font-size: 0.8rem; pointer-events: none;}
        
        .file-info { flex-grow: 1; overflow: hidden; }
        .file-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e2e8f0;}
        .file-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
        
        .check-box { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-box" class="box" style="text-align: center; margin-top: 15vh;">
        <h2>🔒 Security Gateway</h2>
        <input type="password" id="admin-pass" placeholder="Enter Master Key">
        <button onclick="login()" class="btn-primary">Unlock Dashboard</button>
        <a href="index.html" style="display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 0.9rem;">← Back to Gallery</a>
    </div>

    <div id="dashboard" class="box" style="display: none; max-width: 800px;">
        <h2>🎛️ Command Center</h2>
        
        <!-- Storage Bar -->
        <div class="storage-info" id="storage-text">Calculating Storage...</div>
        <div class="progress-bg"><div class="progress-fill" id="storage-bar"></div></div>
        
        <!-- Filter & Bulk Options -->
        <div class="toolbar">
            <input type="checkbox" id="select-all" class="check-box" onclick="toggleSelectAll()">
            <input type="date" id="date-filter" onchange="renderFiles()">
            <button onclick="bulkDelete()" class="btn-del-bulk">🗑️ Delete Selected</button>
        </div>
        
        <div id="file-list"></div>
    </div>

    <script>
        const WORKER_URL = 'https://ourmemory.mrony8552.workers.dev';
        let currentPass = '';
        let allFiles = [];
        const MAX_STORAGE_GB = 10; // Cloudflare Free Tier (10GB)

        async function login() {
            currentPass = document.getElementById('admin-pass').value;
            const res = await fetch(`${WORKER_URL}/api/admin/files`, { headers: { 'X-Admin-Password': currentPass } });
            if (res.ok) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                const data = await res.json();
                allFiles = data.files.filter(f => f.key.startsWith('reaction-')); // শুধু ভিডিও
                updateStorage(data.totalSize);
                renderFiles();
            } else alert("Access Denied!");
        }

        function updateStorage(usedBytes) {
            const usedMB = (usedBytes / (1024 * 1024)).toFixed(1);
            const usedGB = (usedBytes / (1024 * 1024 * 1024)).toFixed(2);
            const percent = (usedGB / MAX_STORAGE_GB) * 100;
            
            document.getElementById('storage-text').innerHTML = `Storage Used: <b>${usedGB} GB</b> of ${MAX_STORAGE_GB} GB (${allFiles.length} videos)`;
            const bar = document.getElementById('storage-bar');
            bar.style.width = `${Math.min(percent, 100)}%`;
            if(percent > 80) bar.classList.add('danger'); // 80% এর বেশি হলে লাল হবে
        }

        function renderFiles() {
            const list = document.getElementById('file-list');
            const filterDate = document.getElementById('date-filter').value;
            list.innerHTML = '';
            document.getElementById('select-all').checked = false;

            const filteredFiles = allFiles.filter(f => {
                if(!filterDate) return true;
                return new Date(f.uploaded).toISOString().split('T')[0] === filterDate; // তারিখ অনুযায়ী ফিল্টার
            });

            if(filteredFiles.length === 0) return list.innerHTML = '<p style="color:#94a3b8; text-align:center;">No videos found.</p>';

            filteredFiles.forEach(f => {
                const date = new Date(f.uploaded).toLocaleString();
                const videoUrl = `${WORKER_URL}/api/admin/video/${f.key}?pass=${currentPass}`;
                
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <input type="checkbox" class="check-box file-cb" value="${f.key}">
                    <div class="thumb-wrapper" onclick="window.open('${videoUrl}', '_blank')" style="cursor:pointer;">
                        <!-- Thumbnail Magic: preload="metadata" #t=0.1 -->
                        <video src="${videoUrl}#t=0.1" preload="metadata" muted playsinline></video>
                        <div class="play-icon">▶</div>
                    </div>
                    <div class="file-info">
                        <div class="file-name">${f.key}</div>
                        <div class="file-meta">📅 ${date} • ${(f.size / (1024*1024)).toFixed(2)} MB</div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('select-all').checked;
            document.querySelectorAll('.file-cb').forEach(cb => cb.checked = isChecked);
        }

        async function bulkDelete() {
            const checked = document.querySelectorAll('.file-cb:checked');
            if(checked.length === 0) return alert("Select videos first!");
            if(!confirm(`Permanently delete ${checked.length} videos?`)) return;

            const keys = Array.from(checked).map(cb => cb.value);
            const res = await fetch(`${WORKER_URL}/api/admin/files/bulk`, {
                method: 'DELETE',
                headers: { 'X-Admin-Password': currentPass, 'Content-Type': 'application/json' },
                body: JSON.stringify({ keys })
            });
            
            if(res.ok) {
                // সফল হলে লিস্ট থেকে বাদ দিয়ে রিফ্রেশ
                allFiles = allFiles.filter(f => !keys.includes(f.key));
                renderFiles();
            } else alert("Failed to delete");
        }
    </script>
</body>
</html>
