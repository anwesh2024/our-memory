<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000000; --card: #1c1c1e; --text: #f2f2f7; --text-muted: #8e8e93; --accent: #ff2d55; --accent-hover: #ff375f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 0; padding-bottom: 90px; overflow-x: hidden; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        .page-header { font-size: 2rem; font-weight: 600; margin-top: 20px; margin-bottom: 25px; letter-spacing: -0.5px; }
        
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        
        input[type="password"] { width: 100%; padding: 16px; margin: 10px 0; background: #2c2c2e; border: none; color: white; border-radius: 14px; font-size: 1rem; outline: none; }
        .btn { padding: 14px 20px; border: none; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: 0.2s; width: 100%; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: white; }
        
        .storage-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; font-weight: 500; }
        .progress-track { background: #333336; border-radius: 10px; width: 100%; height: 6px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #ff2d55, #ff375f); height: 100%; width: 0%; border-radius: 10px; transition: width 1s ease; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .select-all-wrapper { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-muted); }
        .del-btn-small { background: rgba(255, 59, 48, 0.15); color: #ff3b30; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

        .custom-cb { appearance: none; width: 22px; height: 22px; border: 1.5px solid #555; border-radius: 50%; outline: none; cursor: pointer; position: relative; transition: 0.2s; flex-shrink: 0; background: transparent; }
        .custom-cb:checked { background: var(--accent); border-color: var(--accent); }
        .custom-cb:checked::after { content: '✓'; position: absolute; color: white; font-size: 12px; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .file-list { display: flex; flex-direction: column; gap: 12px; }
        .file-item { display: flex; align-items: center; gap: 15px; background: var(--card); padding: 12px; border-radius: 18px; transition: transform 0.2s; }
        .file-item:active { transform: scale(0.98); background: #2c2c2e; }
        
        .thumb-box { position: relative; width: 65px; height: 65px; border-radius: 12px; background: #000; overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .thumb-box video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.2); backdrop-filter: blur(4px); width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        .play-icon svg { width: 12px; height: 12px; fill: white; margin-left: 2px; }

        .file-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
        .file-title { font-size: 0.95rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; color: var(--text); }
        .file-meta { display: flex; gap: 8px; font-size: 0.75rem; color: var(--text-muted); align-items: center; }
        .file-meta span { background: #2c2c2e; padding: 3px 8px; border-radius: 6px; font-weight: 500; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal.active { display: flex; }
        .player-wrapper { width: 95%; max-width: 500px; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .player-wrapper video { width: 100%; display: block; outline: none; }
        .close-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; z-index: 10; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); border-radius: 50%; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Screen -->
        <div id="login-box" style="margin-top: 20vh;">
            <div class="page-header" style="text-align: center;">Security</div>
            <div class="card">
                <input type="password" id="admin-pass" placeholder="Enter Master Key">
                <button onclick="login()" class="btn btn-primary" style="margin-top: 10px;">Unlock</button>
            </div>
            <a href="index.html" style="display: block; text-align: center; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; margin-top: 20px;">Return to Gallery</a>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" style="display: none;">
            <div class="page-header">Dashboard</div>
            
            <div class="card">
                <div class="storage-header">
                    <span id="storage-text">0 MB used</span>
                    <span id="storage-count">0 videos</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="storage-bar"></div></div>
            </div>
            
            <div class="toolbar">
                <label class="select-all-wrapper">
                    <input type="checkbox" id="select-all" class="custom-cb" onclick="toggleSelectAll()">
                    Select All
                </label>
                <button onclick="bulkDelete()" class="del-btn-small">Delete</button>
            </div>
            
            <div id="file-list" class="file-list"></div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="vid-modal" class="modal">
        <div class="close-btn" onclick="closePlayer()">&times;</div>
        <div class="player-wrapper">
            <video id="main-player" controls playsinline></video>
        </div>
    </div>

    <script>
        <script>
        // --- 100% GUARANTEED BACK BUTTON FIX (HASH TRICK) ---
        window.onload = function() {
            // পেজ লোড হলেই URL-এর শেষে #panel বসিয়ে একটি হিস্ট্রি তৈরি করবে
            window.location.hash = "panel"; 
            
            // ইউজার ব্যাক বাটনে চাপলে যখন #panel রিমুভ হবে, তখন এই ফাংশন কাজ করবে
            window.onhashchange = function() {
                if (!window.location.hash) {
                    window.location.replace("index.html"); // সরাসরি গ্যালারিতে পাঠিয়ে দেবে
                }
            };
        };

        const WORKER_URL = 'https://ourmemory.mrony8552.workers.dev';
        // ... (বাকি সব কোড ঠিক আগের মতোই থাকবে)
        let currentPass = ''; let allFiles = [];

        async function login() {
            currentPass = document.getElementById('admin-pass').value;
            const res = await fetch(`${WORKER_URL}/api/admin/files`, { headers: { 'X-Admin-Password': currentPass } });
            if (res.ok) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                const data = await res.json();
                allFiles = data.files.filter(f => f.key.startsWith('reaction-') && f.size > 20000); 
                updateStorage(data.totalSize); renderFiles();
            } else alert("Incorrect Key!");
        }

        function updateStorage(usedBytes) {
            const usedMB = (usedBytes / (1024 * 1024)).toFixed(1);
            const percent = (usedMB / 10240) * 100; // 10GB limit
            document.getElementById('storage-text').innerText = `${usedMB} MB used`;
            document.getElementById('storage-count').innerText = `${allFiles.length} videos`;
            document.getElementById('storage-bar').style.width = `${Math.min(percent, 100)}%`;
        }

        function renderFiles() {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            if(allFiles.length === 0) return list.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 30px;">No records found.</p>';

            allFiles.forEach(f => {
                const dateObj = new Date(f.uploaded);
                const time = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const date = dateObj.toLocaleDateString([], {month: 'short', day: 'numeric'});
                const videoUrl = `${WORKER_URL}/api/admin/video/${f.key}?pass=${currentPass}`;
                
                // ভিডিও সাইজ ক্যালকুলেট করা হলো
                const sizeMB = (f.size / (1024 * 1024)).toFixed(2);
                
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <input type="checkbox" class="custom-cb file-cb" value="${f.key}">
                    <div class="thumb-box" onclick="playVideo('${videoUrl}')">
                        <video src="${videoUrl}#t=0.5" preload="metadata" muted></video>
                        <div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
                    </div>
                    <div class="file-info">
                        <div class="file-title">${f.key.replace('reaction-', 'Record-').replace('.webm', '')}</div>
                        <div class="file-meta">
                            <span>${date}</span>
                            <span>${time}</span>
                            <span style="background: rgba(255, 45, 85, 0.15); color: #ff2d55; font-weight: bold;">${sizeMB} MB</span>
                        </div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('select-all').checked;
            document.querySelectorAll('.file-cb').forEach(cb => cb.checked = isChecked);
        }

        async function bulkDelete() {
            const checked = document.querySelectorAll('.file-cb:checked');
            if(checked.length === 0) return;
            if(!confirm(`Permanently delete ${checked.length} selected videos?`)) return;

            const keys = Array.from(checked).map(cb => cb.value);
            const res = await fetch(`${WORKER_URL}/api/admin/files/bulk`, {
                method: 'DELETE', headers: { 'X-Admin-Password': currentPass, 'Content-Type': 'application/json' }, body: JSON.stringify({ keys })
            });
            if(res.ok) { 
                allFiles = allFiles.filter(f => !keys.includes(f.key)); 
                renderFiles(); 
                document.getElementById('select-all').checked = false; 
            }
        }

        function playVideo(url) {
            const modal = document.getElementById('vid-modal');
            const player = document.getElementById('main-player');
            player.src = url; modal.classList.add('active'); player.play();
        }

        function closePlayer() {
            const modal = document.getElementById('vid-modal');
            const player = document.getElementById('main-player');
            player.pause(); player.src = ''; modal.classList.remove('active');
        }
    </script>
</body>
</html>
