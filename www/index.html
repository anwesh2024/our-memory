<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Gallery</title>
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body class="theme-light">

    <div id="entry-screen" class="screen active-screen">
        <div class="entry-content">
            <h1 class="cursive-title">You & Me <span id="secret-heart" style="cursor:pointer;">❤️</span></h1>
            <p class="subtitle">Welcome to our private space.</p>
            <button id="enter-btn" class="primary-btn">Enter</button>
        </div>
    </div>

    <div id="gallery-screen" class="screen">
        <header class="app-header">
            <h2 class="cursive-title small-cursive">Our Moments</h2>
            <div class="header-actions">
                <!-- Slideshow Button -->
                <button id="slideshow-btn" class="icon-btn" title="Play Slideshow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button id="layout-toggle" class="icon-btn" title="Change Grid">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                </button>
                <button id="theme-toggle" class="icon-btn" title="Change Theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </header>

        <div id="gallery-grid" class="grid-style-5"></div>

        <!-- Bulk Delete Floating Bar -->
        <div id="bulk-action-bar" class="bulk-action-bar">
            <span id="bulk-count">0 selected</span>
            <button id="bulk-delete-btn" class="danger-btn">Delete</button>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-home">
                <span class="nav-icon">🏠</span><span class="nav-text">Home</span>
            </button>
            <button class="nav-item" id="nav-delete">
                <span class="nav-icon">🗑️</span><span class="nav-text">Select</span>
            </button>
            <div class="nav-fab-wrapper">
                <button id="upload-fab" class="fab-btn">+</button>
                <input type="file" id="image-upload-input" accept="image/*" multiple style="display: none;">
            </div>
            <button class="nav-item" id="nav-favs">
                <span class="nav-icon">✨</span><span class="nav-text">Favs</span>
            </button>
            <a href="admin.html" class="nav-item" style="text-decoration: none; color: inherit;">
                <span class="nav-icon">👤</span><span class="nav-text">Admin</span>
            </a>
        </nav>
    </div>

    <!-- Fullscreen & Slideshow Modal -->
    <div id="fullscreen-modal" class="fullscreen-modal">
        <span class="close-modal" id="close-modal-btn">&times;</span>
        <img id="fullscreen-img" src="" alt="">
    </div>

    <script src="app.js?v=4.0"></script>
</body>
</html>
