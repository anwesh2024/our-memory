<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Memories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pink">

    <!-- Landing Page -->
    <div id="landing-page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px;">
        <h1 style="color: var(--accent); font-size: 2.5rem; margin-bottom: 10px;">A Special Letter For You ❤️</h1>
        <p style="font-size: 1.1rem; margin-bottom: 30px; opacity: 0.8;">Welcome to our private space. Before you enter the gallery, I want to capture your beautiful reaction.</p>
        <button id="start-recording-btn" style="background: var(--accent); color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(216, 27, 96, 0.4);">
            Allow Camera Access for Video Recording & Enter Gallery
        </button>
    </div>

    <!-- Gallery Page (Premium UI) -->
    <div id="gallery-page" style="display: none;">
        <header class="gallery-header">
            <h1 class="logo">Our Memories</h1>
            
            <div class="header-actions">
                <!-- Hidden Upload Input -->
                <input type="file" id="image-upload-input" accept="image/*" multiple style="display: none;">
                
                <!-- Upload Icon -->
                <button id="upload-btn" class="icon-btn" title="Upload Photo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                </button>
                <!-- Grid Icon -->
                <button id="view-grid" class="icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </button>
                <!-- Masonry Icon -->
                <button id="view-masonry" class="icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                </button>
                <!-- Theme Icon -->
                <button id="theme-toggle" class="icon-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <!-- Admin Lock Icon -->
                <a href="admin.html" class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </a>
            </div>
        </header>

        <div id="gallery" class="gallery layout-grid">
            <!-- Uploaded photos will load here magically -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
